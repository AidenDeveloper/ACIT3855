# HYBRID MODE, VM SIDE: public entry point + monitoring. No application services run here.
# "laptop" resolves to your laptop's Tailscale IP (extra_hosts), so the config files stay static.
# Run from a .env containing DOMAIN, ADMIN_*, GRAFANA_ADMIN_PASSWORD, DB_PASSWORD,
# LAPTOP_TS_IP, VM_TS_IP (see .env.vm.example).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_HASH: ${ADMIN_HASH:?set ADMIN_HASH in .env}
    extra_hosts:
      - "laptop:${LAPTOP_TS_IP:?set LAPTOP_TS_IP in .env}"
    volumes:
      - ./caddy/Caddyfile.hybrid:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    extra_hosts:
      - "laptop:${LAPTOP_TS_IP}"
    volumes:
      - ./prometheus/prometheus.hybrid.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    volumes:
      - loki-data:/loki
    ports:
      # reachable over Tailscale only: the laptop's Alloy pushes logs here
      - "${VM_TS_IP:?set VM_TS_IP in .env}:3100:3100"

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    extra_hosts:
      - "laptop:${LAPTOP_TS_IP}"
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources/datasources.hybrid.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command: ["--path.rootfs=/host"]

volumes:
  caddy-data:
  caddy-config:
  loki-data:
  grafana-storage:
