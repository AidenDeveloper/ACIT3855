version: 1
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: INFO
    formatter: simple
    filename: app.log
loggers:
  receiver:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  uvicorn:
    level: WARNING
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: WARNING
    handlers: [console]
    propagate: false
  connexion:
    level: WARNING
    handlers: [console]
    propagate: false
  asyncio:
    level: WARNING
    handlers: [console]
    propagate: false
  aiokafka:
    level: CRITICAL   # our own messages report Kafka problems; set to WARNING to debug
    handlers: [console]
    propagate: false
root:
  level: DEBUG
  handlers: [console, file]
disable_existing_loggers: false
