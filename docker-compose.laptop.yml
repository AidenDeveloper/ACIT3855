# HYBRID MODE, LAPTOP SIDE: the application + Kafka + MySQL.
# Every published port is bound to the laptop's TAILSCALE IP only (not your LAN, not the Internet).
# Run from a .env containing TS_IP, VM_TS_IP, DB_PASSWORD, MYSQL_ROOT_PASSWORD (see .env.laptop.example).
services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: realm_events
      MYSQL_USER: realm_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: America/Vancouver
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # host port 3307 (a local MySQL on 3306 would clash), reachable over Tailscale only
      - "${TS_IP:?set TS_IP in .env}:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.10
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --set redpanda.auto_create_topics_enabled=true
    volumes:
      - redpanda:/var/lib/redpanda/data
    ports:
      # metrics endpoint, scraped by Prometheus on the VM
      - "${TS_IP}:9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.4
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "${TS_IP}:8085:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  receiver:
    build:
      context: receiver
    restart: unless-stopped
    command: ["uvicorn", "receiver:app", "--host", "0.0.0.0", "--port", "8080", "--root-path", "/receiver", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC: events
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    ports:
      - "${TS_IP}:8080:8080"

  storage-worker:
    build:
      context: storage
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://realm_user:${DB_PASSWORD}@db:3306/realm_events
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC: events
      KAFKA_GROUP_ID: storage_worker_group
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 40s

  storage:
    build:
      context: storage
      dockerfile: Dockerfile.api
    restart: unless-stopped
    command: ["uvicorn", "storage:app", "--host", "0.0.0.0", "--port", "8090", "--root-path", "/storage", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      DATABASE_URL: mysql+pymysql://realm_user:${DB_PASSWORD}@db:3306/realm_events
      SETTLE_SECONDS: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    ports:
      - "${TS_IP}:8090:8090"

  processing:
    build:
      context: processing
    restart: unless-stopped
    command: ["uvicorn", "processing:app", "--host", "0.0.0.0", "--port", "8100", "--root-path", "/processing", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      STORAGE_URL: http://storage:8090
      STATS_PATH: /data/statistics.json
      POLL_INTERVAL_SECONDS: "5"
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/status"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - processing-data:/data
    ports:
      - "${TS_IP}:8100:8100"

  anomaly:
    build:
      context: anomaly
    restart: unless-stopped
    command: ["uvicorn", "anomaly:app", "--host", "0.0.0.0", "--port", "8110", "--root-path", "/anomaly", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC: events
      DLQ_TOPIC: anomalies
      COMBAT_DAMAGE_ABOVE: "4500"
      GOLD_ABOVE: "9500"
      GOLD_BELOW: "10"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8110/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    ports:
      - "${TS_IP}:8110:8110"

  # Ships this machine's container logs to Loki, which runs on the VM
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    extra_hosts:
      - "vm:${VM_TS_IP:?set VM_TS_IP in .env}"
    volumes:
      - ./prometheus/config.hybrid.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

volumes:
  mysql-data:
  processing-data:
  redpanda:
