apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: MySQL
    uid: mysql
    type: mysql
    access: proxy
    url: db:3306
    user: realm_user
    jsonData:
      database: realm_events
    secureJsonData:
      password: change_me_please

  - name: Infinity
    uid: infinity
    type: yesoreyeram-infinity-datasource
    access: proxy
